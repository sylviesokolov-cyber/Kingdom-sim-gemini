<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.8" />

  <!-- Shield Emblem -->
  <path d="M 256 70 Q 380 90 380 200 C 380 320 256 420 256 430 C 256 420 132 320 132 200 Q 132 90 256 70 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Inner Shield Inlay -->
  <path d="M 256 95 Q 355 110 355 200 C 355 295 256 385 256 395 C 256 385 157 295 157 200 Q 157 110 256 95 Z" 
        fill="#090d16" opacity="0.6" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Majestic Royal Crown -->
  <path d="M 176 300 L 176 220 L 210 255 L 256 185 L 302 255 L 336 220 L 336 300 Z" 
        fill="url(#goldGrad)" stroke="#78350f" stroke-width="4" filter="url(#glow)" />

  <!-- Crown Base Band -->
  <rect x="170" y="295" width="172" height="24" rx="6" fill="url(#goldGrad)" stroke="#78350f" stroke-width="3" />

  <!-- Crown Jewels -->
  <circle cx="176" cy="216" r="8" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="2" />
  <circle cx="256" cy="180" r="10" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="2.5" />
  <circle cx="336" cy="216" r="8" fill="url(#rubyGrad)" stroke="#fef08a" stroke-width="2" />

  <!-- Base Band Gemstones -->
  <circle cx="210" cy="307" r="5" fill="url(#rubyGrad)" />
  <circle cx="256" cy="307" r="6" fill="#38bdf8" />
  <circle cx="302" cy="307" r="5" fill="url(#rubyGrad)" />

  <!-- Cross / Star of Valenreach -->
  <path d="M 256 335 L 260 350 L 275 354 L 260 358 L 256 373 L 252 358 L 237 354 L 252 350 Z" 
        fill="url(#goldGrad)" />
</svg>
